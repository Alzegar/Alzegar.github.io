<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intranet UNFV</title>

    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>

    <h1 class="titulo-intranet">INTRANET-UNFV</h1>

    <div class="formulario">

        <form id="loginForm">

            <div class="login-card">

                <img src="src/img/logounfv.png" class="logounfv">

                <div class="username">
                    <input
                        type="text"
                        id="usuario"
                        required
                    >

                    <label>Nombre de usuario</label>
                </div>


                <div class="username">

                    <input
                        type="password"
                        id="contrasena"
                        required
                    >

                    <label>Contraseña</label>

                </div>


                <div class="recordar">
                    ¿Olvidó su contraseña?
                </div>


                <input
                    type="submit"
                    value="Iniciar"
                >


                <p id="mensaje"></p>


                <div class="registrarse">
                    ¿Quieres hacer el
                    <a href="#">registro</a>
                </div>

            </div>

        </form>

    </div>


    <script
        type="module"
        src="src/js/login.js">
    </script>

</body>

</html>
